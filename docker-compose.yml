version: "3.9"

services:

  user-db:
    image: postgres:16
    container_name: busbooking-user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: busbooking_user_db
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - billing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  route-db:
    image: postgres:16
    container_name: busbooking-route-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: busbooking_route_db
    ports:
      - "5434:5432"
    volumes:
      - route-db-data:/var/lib/postgresql/data
    networks:
      - billing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  trip-db:
    image: postgres:16
    container_name: busbooking-trip-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: busbooking_trip_db
    ports:
      - "5435:5432"
    volumes:
      - trip-db-data:/var/lib/postgresql/data
    networks:
      - billing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  booking-db:
    image: postgres:16
    container_name: busbooking-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: busbooking_booking_db
    ports:
      - "5436:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    networks:
      - busbooking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    container_name: user-service
    build:
      context: .
      dockerfile: user-service/Dockerfile
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
    env_file:
      - ./user-service/.env.docker
    ports:
      - "3002:3002"
    networks:
      - busbooking-network

  route-service:
    container_name: route-service
    build:
      context: .
      dockerfile: route-service/Dockerfile
    restart: unless-stopped
    depends_on:
      route-db:
        condition: service_healthy
    env_file:
      - ./route-service/.env.docker
    ports:
      - "3007:3007"
    networks:
      - busbooking-network

  trip-service:
    container_name: trip-service
    build:
      context: .
      dockerfile: trip-service/Dockerfile
    restart: unless-stopped
    depends_on:
      trip-db:
        condition: service_healthy
    env_file:
      - ./trip-service/.env.docker
    ports:
      - "3008:3008"
    networks:
      - busbooking-network

  booking-service:
    container_name: booking-service
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    restart: unless-stopped
    depends_on:
      booking-db:
        condition: service_healthy
    env_file:
      - ./booking-service/.env.docker
    ports:
      - "3009:3009"
    networks:
      - busbooking-network

  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      - user-service
      - route-service
      - trip-service
      - booking-service
    env_file:
      - ./api-gateway/.env.docker
    ports:
      - "3000:3000"
    networks:
      - busbooking-network

networks:
  busbooking-network:

volumes:
  user-db-data:
  route-db-data:
  trip-db-data:
  booking-db-data: