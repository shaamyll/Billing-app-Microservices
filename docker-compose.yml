services:

  user-db:
    image: postgres:16
    container_name: busbooking-user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: safeerapk11
      POSTGRES_DB: busbooking_user_db
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - busbooking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  route-db:
    image: postgres:16
    container_name: busbooking-route-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: safeerapk11
      POSTGRES_DB: busbooking_route_db
    ports:
      - "5434:5432"
    volumes:
      - route-db-data:/var/lib/postgresql/data
    networks:
      - busbooking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  trip-db:
    image: postgres:16
    container_name: busbooking-trip-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: safeerapk11
      POSTGRES_DB: busbooking_trip_db
    ports:
      - "5435:5432"
    volumes:
      - trip-db-data:/var/lib/postgresql/data
    networks:
      - busbooking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  booking-db:
    image: postgres:16
    container_name: busbooking-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: safeerapk11
      POSTGRES_DB: busbooking_booking_db
    ports:
      - "5436:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    networks:
      - busbooking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16
    container_name: busbooking-payment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: safeerapk11
      POSTGRES_DB: busbooking_payment_db
    ports:
      - "5437:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - busbooking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    container_name: user-service
    build:
      context: .
      dockerfile: user-service/Dockerfile
    restart: unless-stopped
    depends_on:
      user-db:
        condition: service_healthy
    env_file:
      - ./user-service/.env.docker
    ports:
      - "3002:3002"
    networks:
      - busbooking-network

  route-service:
    container_name: route-service
    build:
      context: .
      dockerfile: route-service/Dockerfile
    restart: unless-stopped
    depends_on:
      route-db:
        condition: service_healthy
    env_file:
      - ./route-service/.env.docker
    ports:
      - "3007:3007"
    networks:
      - busbooking-network

  trip-service:
    container_name: trip-service
    build:
      context: .
      dockerfile: trip-service/Dockerfile
    restart: unless-stopped
    depends_on:
      trip-db:
        condition: service_healthy
    env_file:
      - ./trip-service/.env.docker
    ports:
      - "3008:3008"
    networks:
      - busbooking-network

  booking-service:
    container_name: booking-service
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    restart: unless-stopped
    depends_on:
      booking-db:
        condition: service_healthy
    env_file:
      - ./booking-service/.env.docker
    ports:
      - "3009:3009"
    networks:
      - busbooking-network

  payment-service:
    container_name: payment-service
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    restart: unless-stopped
    depends_on:
      payment-db:
        condition: service_healthy
    env_file:
      - ./payment-service/.env.docker
    ports:
      - "3010:3010"
    networks:
      - busbooking-network

  booking-orchestrator:
    container_name: booking-orchestrator
    build:
      context: .
      dockerfile: booking-orchestrator/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      booking-service:
        condition: service_started
      payment-service:
        condition: service_started
    env_file:
      - ./booking-orchestrator/.env.docker
    ports:
      - "3011:3011"
    networks:
      - busbooking-network

  kafka:
    image: apache/kafka:latest
    container_name: busbooking-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - busbooking-network
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  api-gateway:
    container_name: api-gateway
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      - user-service
      - route-service
      - trip-service
      - booking-service
      - payment-service
      - booking-orchestrator
    env_file:
      - ./api-gateway/.env.docker
    ports:
      - "3000:3000"
    networks:
      - busbooking-network

networks:
  busbooking-network:

volumes:
  user-db-data:
  route-db-data:
  trip-db-data:
  booking-db-data:
  payment-db-data:
  kafka-data: